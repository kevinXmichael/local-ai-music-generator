[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "local-ai-music-generator"
version = "0.1.0"
description = "Local free AI lyric-cover generator: use a song as melody/timbre template and re-sing with your lyrics."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "local-ai-music-generator contributors" }]
keywords = ["ai", "music", "singing", "lyrics", "cover", "demucs", "yingmusic"]
dependencies = [
  "numpy>=1.24",
  "soundfile>=0.12",
  "librosa>=0.10",
  "typer>=0.12",
  "rich>=13.0",
  "pyyaml>=6.0",
  "platformdirs>=4.0",
]

[project.optional-dependencies]
separate = ["demucs>=4.0", "torch>=2.1", "torchaudio>=2.1"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6"]

[project.scripts]
local-ai-music = "local_ai_music_generator.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]
